name: "update-terraform-docs"

on:
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "README.yml"
      - "modules/**/README.yml"
      - ".terraform-docs.yml"
      - "modules/**/.terraform-docs.yml"
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Terraform docs (root)
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: .
          config-file: .terraform-docs.yml
          output-file: docs/terraform.md
          output-method: replace
          template: ""

      - name: Generate Terraform docs (modules/log-group)
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: modules/log-group
          config-file: .terraform-docs.yml
          output-file: docs/terraform.md
          output-method: replace
          template: ""

      - name: Generate Terraform docs (modules/metric-alarm)
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: modules/metric-alarm
          config-file: .terraform-docs.yml
          output-file: docs/terraform.md
          output-method: replace
          template: ""

      - name: Generate Terraform docs (modules/composite-alarm)
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: modules/composite-alarm
          config-file: .terraform-docs.yml
          output-file: docs/terraform.md
          output-method: replace
          template: ""

      - name: Fix workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: Generate README (root)
        uses: rafalmasiarek/readme-gen@latest
        with:
          config: README.yml
          output: README.md
          version: latest

      - name: Generate README (modules/log-group)
        uses: rafalmasiarek/readme-gen@latest
        with:
          config: modules/log-group/README.yml
          output: modules/log-group/README.md
          version: latest

      - name: Generate README (modules/metric-alarm)
        uses: rafalmasiarek/readme-gen@latest
        with:
          config: modules/metric-alarm/README.yml
          output: modules/metric-alarm/README.md
          version: latest

      - name: Generate README (modules/composite-alarm)
        uses: rafalmasiarek/readme-gen@latest
        with:
          config: modules/composite-alarm/README.yml
          output: modules/composite-alarm/README.md
          version: latest

      - name: Git Auto-Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update README.md and docs/terraform.md [skip ci]"
          commit_options: "--no-verify --signoff"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <actions@github.com>"
          file_pattern: "README.md docs/terraform.md modules/*/README.md modules/*/docs/terraform.md"
